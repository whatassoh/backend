name: CI/CD production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests et contrôles
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: whatassoh_test
      POSTGRES_USER: whatassoh
      POSTGRES_PASSWORD: test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire et démarrer PostgreSQL de test
        run: |
          docker build \
            --file docker/postgres/Dockerfile \
            --tag whatassoh-postgres:ci \
            .

          docker run --detach \
            --name whatassoh-postgres-ci \
            --publish 5432:5432 \
            --env POSTGRES_DB="$POSTGRES_DB" \
            --env POSTGRES_USER="$POSTGRES_USER" \
            --env POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            whatassoh-postgres:ci

          for attempt in {1..30}; do
            status="$(docker inspect \
              --format='{{.State.Health.Status}}' \
              whatassoh-postgres-ci)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs whatassoh-postgres-ci
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect \
            --format='{{.State.Health.Status}}' \
            whatassoh-postgres-ci)" = "healthy"

          docker exec whatassoh-postgres-ci \
            psql -v ON_ERROR_STOP=1 \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS vector;'

          docker exec whatassoh-postgres-ci \
            psql -v ON_ERROR_STOP=1 \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname IN ('postgis', 'pg_trgm', 'vector') ORDER BY extname;"

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les bibliothèques système
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Installer les dépendances Python
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Exécuter les tests
        run: pytest

      - name: Afficher les journaux PostgreSQL en cas d'échec
        if: failure()
        run: docker logs whatassoh-postgres-ci || true

  deploy:
    name: Déployer en production
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Récupérer le code testé
        uses: actions/checkout@v4

      - name: Préparer SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Déployer le commit testé
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$GITHUB_SHA" "$DEPLOY_DOMAIN" "$LETSENCRYPT_EMAIL" \
            < deploy/deploy-ci.sh
