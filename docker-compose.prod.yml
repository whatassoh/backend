services:
  web:
    image: ${WEB_IMAGE}

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.production

    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --access-logfile -
      --error-logfile -

    ports:
      - "127.0.0.1:${APP_PORT}:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


    # Logs centralisés WhatAssoh -> Graylog
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        gelf-compression-type: "none"
        mode: "non-blocking"
        max-buffer-size: "4m"
        tag: "whatassoh-{{.Name}}"
  worker:
    image: ${WEB_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    command: celery -A config worker --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Run exactly one replica: django-celery-beat persists schedules in Postgres
  # but does not coordinate multiple simultaneous schedulers.

    # Logs centralisés WhatAssoh -> Graylog
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        gelf-compression-type: "none"
        mode: "non-blocking"
        max-buffer-size: "4m"
        tag: "whatassoh-{{.Name}}"
  beat:
    image: ${WEB_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    command: celery -A config beat --loglevel=INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


    # Logs centralisés WhatAssoh -> Graylog
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        gelf-compression-type: "none"
        mode: "non-blocking"
        max-buffer-size: "4m"
        tag: "whatassoh-{{.Name}}"
  postgres:
    image: whatassoh-postgres:pg17-postgis3.5-pgvector0.8.6
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        PGVECTOR_VERSION: "0.8.6"

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
