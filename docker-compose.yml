services:

  postgres:
    image: whatassoh-postgres:pg17-postgis3.5-pgvector0.8.6
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        PGVECTOR_VERSION: "0.8.6"

    environment:
      POSTGRES_DB: whatassoh_db
      POSTGRES_USER: whatassoh
      POSTGRES_PASSWORD: password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U whatassoh -d whatassoh_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    command:
      redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  redis_data:
